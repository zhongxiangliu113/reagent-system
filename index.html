<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>化学试剂管理系统（完整版）</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="sidebar">
    <h2>化学试剂管理系统</h2>
    <ul>
      <li data-page="page-stats" class="active">化学试剂统计</li>
      <li data-page="page-reagents">化学试剂表格</li>
      <li data-page="page-groups">项目组管理</li>
      <li data-page="page-discontinued">停产试剂</li>
      <li data-page="page-history">变更历史</li>
    </ul>
  </div>

  <div id="main">

    <!-- 化学试剂统计 -->
    <div id="page-stats" class="page active">
      <h3>化学试剂统计</h3>
      <div id="stats-container">
        <div class="stat-box">
          <h4>试剂总数</h4>
          <span id="stat-total">0</span>
        </div>
        <div class="stat-box">
          <h4>有图片的试剂</h4>
          <span id="stat-with-image">0</span>
        </div>
        <div class="stat-box">
          <h4>无图片的试剂</h4>
          <span id="stat-no-image">0</span>
        </div>
      </div>
    </div>

    <!-- 化学试剂表格 -->
    <div id="page-reagents" class="page">
      <h3>化学试剂表格</h3>

      <div class="toolbar">
        <input type="text" id="search-reagents" placeholder="搜索试剂..." />
        <button data-action="add-row" data-module="reagents">新增行</button>
        <button data-action="add-col" data-module="reagents">新增列</button>
      </div>

      <table id="table-reagents">
        <thead>
          <tr>
            <th>序号<span class="col-menu-btn">▼</span></th>
            <th>试剂名称<span class="col-menu-btn">▼</span></th>
            <th>厂商<span class="col-menu-btn">▼</span></th>
            <th>批号<span class="col-menu-btn">▼</span></th>
            <th>数量<span class="col-menu-btn">▼</span></th>
            <th>备注<span class="col-menu-btn">▼</span></th>
            <th>图片/附件<span class="col-menu-btn">▼</span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- 项目组管理 -->
    <div id="page-groups" class="page">
      <h3>项目组管理</h3>

      <div class="toolbar">
        <input type="text" id="search-groups" placeholder="搜索项目组..." />
        <button data-action="add-row" data-module="groups">新增行</button>
        <button data-action="add-col" data-module="groups">新增列</button>
      </div>

      <table id="table-groups">
        <thead>
          <tr>
            <th>序号<span class="col-menu-btn">▼</span></th>
            <th>项目组名称<span class="col-menu-btn">▼</span></th>
            <th>试剂名称<span class="col-menu-btn">▼</span></th>
            <th>厂商<span class="col-menu-btn">▼</span></th>
            <th>备注<span class="col-menu-btn">▼</span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- 停产试剂 -->
    <div id="page-discontinued" class="page">
      <h3>停产试剂</h3>

      <div class="toolbar">
        <input type="text" id="search-discontinued" placeholder="搜索停产试剂..." />
        <button data-action="add-row" data-module="discontinued">新增行</button>
        <button data-action="add-col" data-module="discontinued">新增列</button>
      </div>

      <table id="table-discontinued">
        <thead>
          <tr>
            <th>序号<span class="col-menu-btn">▼</span></th>
            <th>试剂名称<span class="col-menu-btn">▼</span></th>
            <th>厂商<span class="col-menu-btn">▼</span></th>
            <th>停产证据<span class="col-menu-btn">▼</span></th>
            <th>停产日期<span class="col-menu-btn">▼</span></th>
            <th>备注<span class="col-menu-btn">▼</span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- 变更历史 -->
    <div id="page-history" class="page">
      <h3>变更历史</h3>

      <div class="toolbar">
        <input type="text" id="search-history" placeholder="搜索历史记录..." />
        <button data-action="add-row" data-module="history">新增行</button>
        <button data-action="add-col" data-module="history">新增列</button>
      </div>

      <table id="table-history">
        <thead>
          <tr>
            <th>序号<span class="col-menu-btn">▼</span></th>
            <th>操作人<span class="col-menu-btn">▼</span></th>
            <th>内容<span class="col-menu-btn">▼</span></th>
            <th>时间<span class="col-menu-btn">▼</span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>

  <!-- 通用菜单 -->
  <div id="colMenu" class="context-menu">
    <button data-menu="delete-col">删除此列</button>
  </div>
  <div id="rowMenu" class="context-menu">
    <button data-menu="delete-row">删除此行</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
